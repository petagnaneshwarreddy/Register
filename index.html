<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script src="./script.js" defer></script>

    <!-- Razorpay Script -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  </head>

  <body>
    <div class="wrapper">
      <div class="title">
        <h1><a href="https://amirtyuniversity.netlify.app/" target="_blank">Amity University</a></h1>
        <div class="subtitle">
          <i class="fas fa-user-graduate"></i>
          <h2>Student Registration Form</h2>
        </div>
      </div>

      <form
        method="POST"
        action="#"
        data-netlify="true"
        name="student-registration-form"
      >
        <div class="form">
          <!-- Personal Information Section -->
          <div class="form-section">
            <h2>Personal Information</h2>

            <div class="inputfield">
              <label for="fname">First Name</label>
              <input
                type="text"
                class="input"
                id="fname"
                name="fname"
                placeholder="Enter your first name"
                maxlength="30"
                pattern="[A-Za-z\s\-]{1,32}"
                title="Please enter valid name"
                required
              />
            </div>

            <div class="inputfield">
              <label for="lname">Last Name</label>
              <input
                type="text"
                class="input"
                id="lname"
                name="lname"
                placeholder="Enter your last name"
                maxlength="30"
                pattern="[A-Za-z\s\-]{1,32}"
                title="Please enter valid name"
                required
              />
            </div>

            <div class="inputfield">
              <label>Gender</label>
              <div class="radio-group">
                <div class="radio-option">
                  <input
                    type="radio"
                    name="gender"
                    id="male"
                    value="Male"
                    required
                  />
                  <label for="male">Male</label>
                </div>
                <div class="radio-option">
                  <input
                    type="radio"
                    name="gender"
                    id="female"
                    value="Female"
                  />
                  <label for="female">Female</label>
                </div>
                <div class="radio-option">
                  <input type="radio" name="gender" id="other" value="Other" />
                  <label for="other">Other</label>
                </div>
              </div>
            </div>

            <div class="inputfield">
              <label for="dob">Date of Birth</label>
              <input type="date" class="input" id="dob" name="dob" required />
            </div>

            <div class="inputfield">
              <label for="age">Age</label>
              <input
                type="text"
                class="input"
                id="age"
                name="age"
                placeholder="Age will be calculated automatically"
                readonly
                required
              />
            </div>
          </div>

          <!-- Contact Information Section -->
          <div class="form-section">
            <h2>Contact Information</h2>

            <div class="inputfield">
              <label for="email">Email Address</label>
              <input
                type="email"
                class="input"
                id="email"
                name="email"
                aria-label="Email Address"
                placeholder="Enter your email"
                pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,63}$"
                title="Please enter valid email"
                required
              />
            </div>

            <div class="inputfield">
              <label for="phone-number">Phone Number</label>
              <div class="phone-input">
                <div class="custom-select">
                  <select id="phone-code" name="phone-code">
                    <option value="+91">+91</option>
                  </select>
                </div>
                <input
                  type="tel"
                  class="input"
                  name="phone-number"
                  maxlength="10"
                  id="phone-number"
                  placeholder="Enter your phone number"
                  pattern="[6-9]{1}[0-9]{9}"
                  title="Please enter valid phone number"
                />
              </div>
            </div>

            <div class="inputfield">
              <label for="address">Address</label>
              <textarea
                class="textarea"
                name="address"
                id="address"
                rows="3"
                placeholder="Enter your address"
                maxlength="100"
                required
              ></textarea>
            </div>

            <div class="two-column-group">
              <div class="inputfield">
                <label for="state">State</label>
                <div class="custom-select" required>
                  <select id="state" name="state" required>
                    <option hidden>Select your State or UT</option>
                    <option value="Andaman and Nicobar Islands">Andaman and Nicobar Islands</option>
                    <option value="Andhra Pradesh">Andhra Pradesh</option>
                    <!-- Add all other states here -->
                  </select>
                </div>
              </div>

              <div class="inputfield">
                <label for="pincode">Pin Code</label>
                <input
                  type="text"
                  class="input"
                  id="pincode"
                  name="pincode"
                  placeholder="Enter your pin code"
                  maxlength="6"
                  pattern="^[0-9]{6}$"
                  title="Please enter valid pin code"
                  required
                />
              </div>
            </div>
          </div>

          <!-- Course Selection Section -->
          <div class="form-section">
            <h2>Course Selection</h2>
            <div class="inputfield">
              <label for="course">Select Course</label>
              <select id="course" name="course" required>
                <option value="BTech">BTech</option>
                <option value="MBA">MBA</option>
                <option value="MSc">MSc</option>
                <option value="BBA">BBA</option>
                <!-- Add more courses here -->
              </select>
            </div>

            <div class="inputfield">
              <label for="course-price">Course Price</label>
              <input
                type="text"
                class="input"
                id="course-price"
                name="course-price"
                placeholder="Course price will appear here"
                readonly
                required
              />
            </div>
          </div>

          <!-- Payment Information Section -->
          <div class="form-section">
            <h2>Payment Information</h2>
            <div class="inputfield">
              <button
                type="button"
                class="btn btn-primary"
                id="razorpay-payment-button"
              >
                <i class="fas fa-credit-card"></i> Pay Now
              </button>
            </div>
          </div>

          <!-- Submit and Reset Buttons -->
          <div class="inputfield btns">
            <button type="submit" class="btn btn-primary">
              <i class="fas fa-user-plus"></i> Register
            </button>
            <button type="reset" class="btn btn-secondary">
              <i class="fas fa-redo"></i> Reset
            </button>
          </div>
        </div>
      </form>
    </div>

    <script>
      // When course is selected, display the course price
      document.getElementById("course").addEventListener("change", function() {
        const course = this.value;
        let price = 0;

        switch (course) {
          case "BTech":
            price = 50000;
            break;
          case "MBA":
            price = 80000;
            break;
          case "MSc":
            price = 60000;
            break;
          case "BBA":
            price = 40000;
            break;
          // Add more courses and prices as needed
        }

        document.getElementById("course-price").value = `₹${price}`;
      });

      // Razorpay Payment Integration
      document.getElementById("razorpay-payment-button").onclick = function(e) {
        e.preventDefault();

        const course = document.getElementById("course").value;
        const price = document.getElementById("course-price").value.replace("₹", "");

        const options = {
          key: "YOUR_RAZORPAY_KEY", // Replace with your Razorpay API Key
          amount: price * 100, // Amount in paise
          currency: "INR",
          name: "Amity University",
          description: `Payment for ${course}`,
          image: "https://amirtyuniversity.netlify.app/logo.png", // Optional image for the payment modal
          handler: function (response) {
            alert("Payment Successful! Payment ID: " + response.razorpay_payment_id);
          },
          prefill: {
            name: document.getElementById("fname").value + " " + document.getElementById("lname").value,
            email: document.getElementById("email").value,
            contact: document.getElementById("phone-number").value
          },
          notes: {
            address: document.getElementById("address").value
          },
          theme: {
            color: "#F37254"
          }
        };

        const razorpay = new Razorpay(options);
        razorpay.open();
      };
    </script>
  </body>
</html>
